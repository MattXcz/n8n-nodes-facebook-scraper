háme. \n5)Až karamel trochu vychladne, můžeme jej přecedit, aby byl krásně hladký.  Karamelovou omáčku uchovávejte v lednici.\n \nTip: spolu s máslem můžete přidat špetku soli, pokud toužíte po slaném karamelu","ranges":[]},"translated_message_for_viewer":null},"extensions":{"all_video_dash_prefetch_representations":[{"initial_representation_ids":[],"video_id":"1397612515779779","nextgendash":true},{"initial_representation_ids":[],"video_id":"28670499499212735","nextgendash":true}],"is_final":false}},"sequence_number":0}}]]]}}]]]}</script>
